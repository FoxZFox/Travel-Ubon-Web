<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Travel</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      #rotate-warning {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        color: #fff;
        font-size: 24px;
        text-align: center;
        z-index: 9999;
        padding-top: 40vh;
      }

    </style>
  </head>
  <body>
    <div id="rotate-warning">กรุณาหมุนหน้าจอเป็นแนวนอนเพื่อเล่นเกม</div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=800 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <script>
      function checkOrientation() {
        const warning = document.getElementById('rotate-warning');
        const canvas = document.getElementById('unity-canvas');
        if (window.innerHeight > window.innerWidth) {
          // แนวตั้ง
          warning.style.display = 'block';
          canvas.style.display = 'none';
        } else {
          // แนวนอน
          warning.style.display = 'none';
          canvas.style.display = 'block';
        }
      }

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
      window.addEventListener("load", checkOrientation);
    </script>

  <script>
    function resizeUnityCanvas() {
      const container = document.getElementById("unity-container");
      const canvas = document.getElementById("unity-canvas");
      const height = window.innerHeight;
      container.style.height = height + "px";
      canvas.style.height = height + "px";
    }

    window.addEventListener("load", resizeUnityCanvas);
    window.addEventListener("resize", resizeUnityCanvas);
    window.addEventListener("orientationchange", () => {
      setTimeout(resizeUnityCanvas, 500); // รอให้หมุนเสร็จก่อนค่อยปรับ
    });
  </script>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Travel-Ubon.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Travel-Ubon.data",
        frameworkUrl: buildUrl + "/Travel-Ubon.framework.js",
        codeUrl: buildUrl + "/Travel-Ubon.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "UBRU",
        productName: "Travel",
        productVersion: "1.0.4",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
